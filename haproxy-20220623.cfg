# If you already have an haproxy.cfg file, you can probably leave the
# global and defaults section as-is, but you might need to increase the
# timeouts so that long-running CLI commands will work.
global

    #log         127.0.0.1 local2
	log         /dev/log local0 debug

    chroot		/var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4096
    user        haproxy
    group		haproxy
    daemon

    # turn on stats unix socket
    stats socket /var/lib/haproxy/stats

    # Default SSL material locations
	# haproxy-certs /etc/haproxy/certs
    ca-base /etc/ssl/certs
#    crt-base /etc/ssl/private

    # Default ciphers to use on SSL-enabled listening sockets.
    # For more information, see ciphers(1SSL). This list is from:
    #  https://hynek.me/articles/hardening-your-web-servers-ssl-ciphers/
    # An alternative list with additional directives can be obtained from
    #  https://mozilla.github.io/server-side-tls/ssl-config-generator/?server=haproxy
    ssl-default-bind-ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS
    ssl-default-bind-options no-sslv3

    # Tuning if required/needed
     tune.ssl.default-dh-param 2048

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option http-server-close
#    option forwardfor       except 127.0.0.0/8
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           10s
    maxconn                 3000
	
resolvers mera-dns
    nameserver amer-ns1 10.175.129.20:53
	nameserver amer-ns2 10.175.129.23:53
	
resolvers stlmpn-dns
    nameserver stlmpn-ns1 10.175.129.21:53
	nameserver stlmpn-ns2 10.175.129.22:53
	

##############################
#MSE Resources
##############################
# listen ProxyLocalStats
frontend stats
   bind *:41199
   stats enable
   stats show-node
   stats hide-version
   stats realm Haproxy\ Statistics
   stats uri /stats
   stats auth Admin:Password


